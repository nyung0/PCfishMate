name: Release Windows installer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-windows.yml', 'internal/release-version.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.428
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build Windows executable
        shell: pwsh
        run: ./build-windows.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content internal/release-version.txt -Raw).Trim()
          $notes = @'
          ### 🐟 PCfishMate v0.6.9

          - 창을 닫으면 트레이로 숨겨져 자동화와 알림을 계속 실행해요. 트레이에서 **열기 / 자동화 시작 / 자동화 중지 / 끝내기**를 사용할 수 있어요.
          - **시즌 물고기 제외**는 전체 시즌, **시즌 재료 제외**는 현재 제작 가능한 시즌을 기준으로 적용해요.
          - 시즌합성 탭에 **합성 가능 알림**을 추가했어요. 교배 횟수와 관계없이 재료가 모이면 알려줘요.
          - 알림에는 합성 가능한 별 등급과 물고기 이름을 표시하고, 이미지는 해당 물고기의 기본 1성 첫 번째 색상을 사용해요.

          [Steam 이용약관 제4조](https://store.steampowered.com/subscriber_agreement/#4)
          '@
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/PCfishMate.exe dist/SHA256SUMS.txt --clobber
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh api --method PATCH "repos/$env:GITHUB_REPOSITORY/git/refs/tags/$tag" -f "sha=$env:GITHUB_SHA" -F force=true
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            gh release edit $tag --title "PCfishMate $tag" --notes "$notes"
          } else {
            gh release create $tag dist/PCfishMate.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "PCfishMate $tag" --notes "$notes"
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
