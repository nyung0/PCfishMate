name: Release Windows installer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-windows.yml', 'internal/release-version.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.428
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build Windows executable
        shell: pwsh
        run: ./build-windows.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content internal/release-version.txt -Raw).Trim()
          $notes = @'
          ### 🐟 PCfishMate v0.6.6

          - 도감에 전체 보유 물고기 수와 게임의 보유 한도를 함께 표시해요. 보유 한도는 새 모듈을 설치하고 게임을 실행한 뒤 확인할 수 있어요.
          - 새 버전이 있으면 버전 옆에 **업데이트** 버튼을 표시해요. 버튼을 한 번 누르면 다운로드하고 앱을 자동으로 재시작해요.
          - 게임 모듈 갱신이 필요하면 게임 종료를 안내해요. 모듈이 같으면 게임을 켜둔 채 앱을 재시작할 수 있어요.

          [Steam 이용약관 제4조](https://store.steampowered.com/subscriber_agreement/#4)
          '@
          gh release create $tag dist/PCfishMate.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "PCfishMate $tag" --notes "$notes"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
