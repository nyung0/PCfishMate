name: Release Windows installer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-windows.yml', 'internal/release-version.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.428
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build Windows executable
        shell: pwsh
        run: ./build-windows.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content internal/release-version.txt -Raw).Trim()
          $notes = @'
          ### 🐟 교배, 도감, 알림 개선

          - 교배 우선순위를 세 단계로 정하고, 희귀도·별 등급·남은 교배 횟수의 정렬 방향을 고를 수 있어요.
          - 도감 정렬도 세 단계로 바꿨어요. 시즌합성에서는 모든 재료를 보면서 즐겨찾기할 수 있어요.
          - 즐겨찾기 알림에 별 등급을 표시하고, 물고기 이미지에 여백을 넣었어요.
          - 설치 안내와 약관은 펼쳐볼 수 있어요.

          ### 업데이트

          - 인증서 오류가 나면 Windows HTTPS 경로로 다시 시도해요.
          - **알림 설정 → 자동 업데이트**를 켜면 새 버전을 받고, 게임 종료 후 앱을 재시작해 적용해요.
          - 기존 앱에서 업데이트 확인이 실패하면 이 페이지에서 `PCfishMate.exe`를 받을 수 있어요.

          [Steam 이용약관 제4조](https://store.steampowered.com/subscriber_agreement/#4)
          '@
          gh release create $tag dist/PCfishMate.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "PCfishMate $tag" --notes "$notes"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
