name: Release Windows installer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-windows.yml', 'internal/release-version.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.428
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build Windows executable
        shell: pwsh
        run: ./build-windows.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content internal/release-version.txt -Raw).Trim()
          $notes = @'
          README와 소스 실행 경로를 현재 PCfishMate에 맞췄습니다.
          클론한 소스와 GitHub Actions에서 같은 Windows 빌드 스크립트를 사용합니다.
          설치 방법은 README를 참고하세요.
          '@
          gh release create $tag dist/PCfishMate.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "PCfishMate $tag" --notes "$notes"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
