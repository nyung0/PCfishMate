name: Release Windows installer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-windows.yml', 'internal/release-version.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.428
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build Windows executable
        shell: pwsh
        run: ./build-windows.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content internal/release-version.txt -Raw).Trim()
          $notes = @'
          ### 🐟 PCfishMate v0.6.5

          - 도감에서 **종 합쳐보기**를 켜면 같은 종의 색상과 별 등급을 한 카드로 묶고 희귀도를 표시해요.
          - 시즌합성 탭에서 게임 저장 데이터가 갱신되면 남은 재료 수량을 다시 표시해요.
          - 제목 옆에 현재 버전을 표시하고, 알림 설정은 인게임 톱니바퀴 아이콘으로 열어요.
          - 새 버전이 있을 때만 버전 옆에 **업데이트** 버튼이 나타나요. 다운로드 후 게임을 종료하고 **재시작 후 설치**를 누르면 적용돼요.

          [Steam 이용약관 제4조](https://store.steampowered.com/subscriber_agreement/#4)
          '@
          gh release create $tag dist/PCfishMate.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "PCfishMate $tag" --notes "$notes"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
