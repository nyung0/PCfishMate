name: Build Windows release

on:
  push:
    branches: ['release/*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.428
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build Windows executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $previous = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" --jq .tag_name
          if ($LASTEXITCODE -eq 0 -and $previous -and $env:GITHUB_REPOSITORY -eq 'nyung0/PCfishMate') {
            ./build-windows.ps1 -PreviousRelease $previous
          } else {
            ./build-windows.ps1
          }
      - name: Upload verified Windows package
        uses: actions/upload-artifact@v4
        with:
          name: pcfishmate-windows
          path: |
            dist/PCfishMate.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
