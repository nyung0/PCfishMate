name: Release Windows installer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-windows.yml', 'internal/release-version.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.428
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build Windows executable
        shell: pwsh
        run: ./build-windows.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content internal/release-version.txt -Raw).Trim()
          $notes = @'
          ### 🐟 PCfishMate v0.6.7

          - 합성 옵션에 **별 등급 조건**을 추가했어요. 체크한 별 등급의 물고기만 자동 합성 재료로 사용해요.
          - 교배·합성 옵션의 제목, 설정 줄, 구분선과 간격을 통일했어요. 펼친 옵션 버튼은 초록색으로 표시해요.
          - 실행·합성 상태는 왼쪽에, 하트와 회복 시간은 오른쪽에 표시해요.
          - 자동화 기록에서 **교배·합성 결과만 보기**를 켜면 결과 물고기만 확인할 수 있어요.

          [Steam 이용약관 제4조](https://store.steampowered.com/subscriber_agreement/#4)
          '@
          gh release create $tag dist/PCfishMate.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "PCfishMate $tag" --notes "$notes"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
