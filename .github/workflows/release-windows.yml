name: Release Windows installer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-windows.yml', 'internal/release-version.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.428
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build Windows executable
        shell: pwsh
        run: ./build-windows.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content internal/release-version.txt -Raw).Trim()
          $notes = @'
          ### 도감 검색과 이미지 오류 수정

          - 같은 어종·희귀도·별 등급의 색상 변종을 대표 이미지 한 장으로 묶고 보유 수량과 교배 횟수를 합산해요.
          - 도감에서 이름 일부로 검색할 수 있어요.
          - 시즌 합성과 도감에서 이미지 로딩을 막던 FMOD 오류를 수정했어요.

          ### 설치

          게임을 종료하고 `PCfishMate.exe`를 실행해요. 설치 안내를 확인하면 산호 흰동가리와 함께 설치 진행률을 볼 수 있어요.

          [Steam 이용약관 제4조](https://store.steampowered.com/subscriber_agreement/#4)에서 자동화 관련 제한을 확인할 수 있어요.
          '@
          gh release create $tag dist/PCfishMate.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "PCfishMate $tag" --notes "$notes"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
