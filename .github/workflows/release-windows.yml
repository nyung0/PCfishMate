name: Release Windows installer

on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-windows.yml', 'internal/release-version.txt']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 6.0.428
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build Windows executable
        shell: pwsh
        run: ./build-windows.ps1
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = (Get-Content internal/release-version.txt -Raw).Trim()
          $notes = @'
          ### 🐠 도감과 즐겨찾기

          - 변종별 도감, 희귀도 필터, 정렬, 즐겨찾기를 추가했어요.
          - 즐겨찾기한 물고기가 자동 교배나 합성으로 나오면 Windows 팝업과 작업표시줄 알림을 각각 켤 수 있어요.
          - 즐겨찾기 파일이 손상되면 백업을 불러와요.

          ### 설치

          게임을 종료하고 `PCfishMate.exe`를 실행해요. 설치 안내를 확인하면 산호 흰동가리와 함께 설치 진행률을 볼 수 있어요.

          [Steam 이용약관 제4조](https://store.steampowered.com/subscriber_agreement/#4)에서 자동화 관련 제한을 확인할 수 있어요.
          '@
          gh release create $tag dist/PCfishMate.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "PCfishMate $tag" --notes "$notes"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
